<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login | Student Result Manager</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><div class="auth-shell"><a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Back to home</a><div class="auth-card"><div class="auth-icon"><i id="roleIcon" class="fa-solid fa-user-graduate"></i></div><h1 id="loginTitle">Student Login</h1><p id="loginSubtitle">Sign in to view your results and progress.</p><div class="role-switch"><a id="studentRole" href="/login.html?role=student">Student</a><a id="teacherRole" href="/login.html?role=teacher">Teacher</a></div><form id="loginForm"><label>Email<input id="email" type="email" placeholder="Enter your email" required></label><label>Password<div class="password-wrap"><input id="password" type="password" placeholder="Enter your password" minlength="6" required><button type="button" id="togglePassword"><i class="fa-solid fa-eye"></i></button></div></label><button class="calculate-btn full-btn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Login</button></form><div id="loginMessage" class="form-message"></div><div class="demo-box"><strong>Demo credentials</strong><span id="demoCredentials"></span></div></div></div><div id="toast" class="toast"></div><script src="/js/app.js"></script><script src="/js/login.js"></script></body></html>
